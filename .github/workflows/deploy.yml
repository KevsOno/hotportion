name: Deploy Hot Portion Grill Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent two deploys from racing each other on main.
concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:

  # ─── 1. TEST BACKEND ───
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --strict-markers

  # ─── 2. DEPLOY BACKEND TO RENDER ───
  deploy-backend-render:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  # ─── 3. DEPLOY FRONTEND TO NETLIFY ───
  deploy-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./frontend
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions (commit ${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ─── 3b. CAPGO LIVE UPDATE (gated on frontend deploy) ───
  deploy-capgo:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Live Update to Capgo
        run: |
          cd mobile
          npx @capgo/cli bundle upload \
            --apikey ${{ secrets.CAPGO_TOKEN }} \
            --channel production \
            --path ../frontend

  # ─── 4. SEO PRE‑RENDERING ───
  prerender-seo:
    needs: [deploy-frontend, deploy-backend-render]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove any malformed root package.json
        run: |
          if [ -f package.json ]; then
            rm -f package.json
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          cd seo
          npm install

      - name: Run prerender
        run: |
          cd seo
          npm run prerender
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL }}

  # ─── 5. BUILD ANDROID RELEASE APK ───
  build-android:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy frontend assets to mobile/frontend
        run: |
          cd mobile
          rm -rf frontend
          cp -r ../frontend frontend/

      - name: Create Capacitor config
        run: |
          cd mobile
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.hotportion.grill",
            "appName": "Hot Portion Grill",
            "webDir": "frontend",
            "server": {
              "androidScheme": "https",
              "iosScheme": "https",
              "allowNavigation": [
                "hotportion.netlify.app",
                "hotportiongrill.com",
                "*.onrender.com"
              ]
            },
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "ios": {
              "scheme": "HotPortion",
              "contentInset": "automatic",
              "backgroundColor": "#E53935",
              "allowsLinkPreview": false,
              "preferredContentMode": "mobile",
              "limitsNavigationsToAppBoundDomains": false
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "backgroundColor": "#E53935",
                "androidScaleType": "CENTER_CROP"
              },
              "CapacitorCookies": {
                "enabled": true
              },
              "CapacitorUpdater": {
                "autoUpdate": true,
                "statsUrl": "https://api.capgo.app/stats",
                "channel": "production"
              }
            }
          }
          EOF

      - name: Install dependencies with strict Capgo versioning
        run: |
          cd mobile
          npm install -g @capacitor/cli@5.7.0
          npm install @capacitor/core@5.7.0 @capacitor/android@5.7.0 --save-exact --ignore-scripts
          npm install @capgo/capacitor-updater@5.0.0 --save-exact --ignore-scripts
          npm install --ignore-scripts

      - name: Add Android platform
        run: |
          cd mobile
          rm -rf android
          npx cap add android

      - name: Enable Network Permissions on Android
        run: |
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi

      - name: Sync Android project
        run: |
          cd mobile
          npx cap sync android

      - name: Decode Android Keystore
        run: |
          mkdir -p mobile/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/release.keystore

      - name: Configure release signing via gradle.properties
        run: |
          cat >> mobile/android/gradle.properties <<EOF
          android.injected.signing.store.file=$GITHUB_WORKSPACE/mobile/android/app/release.keystore
          android.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}
          android.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Release APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  # ─── 6. BUILD IOS APP (UNSIGNED) ───
  build-ios:
    needs: deploy-frontend
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove any malformed root package.json
        run: |
          if [ -f package.json ]; then
            rm -f package.json
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy frontend assets to mobile/frontend
        run: |
          cd mobile
          rm -rf frontend
          cp -r ../frontend frontend/

      - name: Create Capacitor config
        run: |
          cd mobile
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.hotportion.grill",
            "appName": "Hot Portion Grill",
            "webDir": "frontend",
            "server": {
              "androidScheme": "https",
              "iosScheme": "https",
              "allowNavigation": [
                "hotportion.netlify.app",
                "hotportiongrill.com",
                "*.onrender.com"
              ]
            },
            "ios": {
              "scheme": "HotPortion",
              "contentInset": "automatic",
              "backgroundColor": "#E53935",
              "allowsLinkPreview": false,
              "preferredContentMode": "mobile",
              "limitsNavigationsToAppBoundDomains": false
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "backgroundColor": "#E53935"
              },
              "CapacitorUpdater": {
                "autoUpdate": true,
                "statsUrl": "https://api.capgo.app/stats",
                "channel": "production"
              }
            }
          }
          EOF

      - name: Install dependencies with strict Capgo versioning
        run: |
          cd mobile
          npm install -g @capacitor/cli@5.7.0
          npm install @capacitor/core@5.7.0 @capacitor/ios@5.7.0 --save-exact --ignore-scripts
          npm install @capgo/capacitor-updater@5.0.0 --save-exact --ignore-scripts
          npm install --ignore-scripts

      - name: Add iOS platform
        run: |
          cd mobile
          rm -rf ios
          npx cap add ios

      - name: Sync iOS project & Install CocoaPods
        run: |
          cd mobile
          npx cap sync ios

      - name: Build unsigned iOS archive
        run: |
          cd mobile/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath App.xcarchive \
            archive CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: mobile/ios/App/App.xcarchive
