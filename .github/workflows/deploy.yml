name: Deploy Hot Portion Grill Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

jobs:

  # ─── 1. TEST BACKEND ───
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pip install pytest pytest-asyncio
          pytest tests/ -v

  # ─── 2. DEPLOY BACKEND TO FLY.IO ───
  deploy-backend-flyio:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: |
          cd backend
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ─── 3. DEPLOY FRONTEND TO NETLIFY ───
  deploy-frontend-netlify:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./frontend
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions (commit ${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ─── 4. SEO PRE‑RENDERING ───
  prerender-seo:
    needs: deploy-backend-flyio
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: seo/package-lock.json

      - name: Install dependencies
        run: |
          cd seo
          npm install

      - name: Run prerender
        run: |
          cd seo
          npm run prerender
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Upload prerendered files to Netlify (via SCP)
        # Note: Since Netlify is static, you may want to commit these or serve via a separate service.
        # This step assumes you have a separate static server for SEO snapshots.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STATIC_SERVER_HOST }}
          username: ${{ secrets.STATIC_SERVER_USER }}
          key: ${{ secrets.STATIC_SERVER_SSH_KEY }}
          source: "seo/dist/*"
          target: "/var/www/hotportion/"
          strip_components: 2

  # ─── 5. BUILD ANDROID APK (via PWABuilder) ───
  build-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Build Android APK via PWABuilder
        run: |
          pwabuilder build --platform=android --url=https://hotportiongrill.com
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./out/android/*.apk

  # ─── 6. BUILD IOS APP (via Capacitor) ───
  build-ios:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor and dependencies
        run: |
          cd mobile
          npm install -g @capacitor/cli
          npm install

      - name: Sync iOS project
        run: |
          cd mobile
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd mobile/ios/App
          pod install

      - name: Build iOS archive
        run: |
          cd mobile/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath App.xcarchive \
            archive

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: mobile/ios/App/App.xcarchive
