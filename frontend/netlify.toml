[images]
  remote_images = [
    "https://ajmauddonufaryjbiavh.supabase.co/storage/v1/object/public/.*",
    "https://images.unsplash.com/.*",
    "https://plus.unsplash.com/.*"
  ]

[build]
  publish = "."
  command = "echo 'No build required for static PWA'"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ─── PROXY CONFIGURATION ───
[[redirects]]
  from = "/api/*"
  to = "https://hotportion.onrender.com/api/:splat"
  status = 200
  force = true

# ─── SPA FALLBACK ───
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── GLOBAL SECURITY HEADERS ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://ajmauddonufaryjbiavh.supabase.co https://*.supabase.co https://images.unsplash.com https://plus.unsplash.com https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://hotportion.onrender.com https://ajmauddonufaryjbiavh.supabase.co https://nominatim.openstreetmap.org https://api.unsplash.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"

# ─── CACHE CONTROL HEADERS ───
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
