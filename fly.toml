# fly.toml - Hot Portion Grill Backend
app = "hotportion-api"                # CHANGE THIS to a unique name
primary_region = "cdg"                # Choose closest to your users (cdg = Paris, lon = London, ewr = US East)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false           # Keep the app always on
  min_machines_running = 1
  max_machines_running = 3             # Auto-scale up to 3 containers

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[env]
  DEBUG = "false"
  AI_PRIMARY = "groq"
  AI_FALLBACK = "gemini"

[metrics]
  port = 9999
  path = "/metrics"
