# fly.toml (located at the root of your repository)
app = "hotportion"                 # Use your actual app name (you created "hotportion")
primary_region = "ams"             # Amsterdam – you selected this already

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
  max_machines_running = 3

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[env]
  DEBUG = "false"
  AI_PRIMARY = "groq"
  AI_FALLBACK = "gemini"

[metrics]
  port = 9999
  path = "/metrics"
