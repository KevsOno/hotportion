# render.yaml
services:
  - type: web
    name: hotportion
    runtime: docker
    repo: https://github.com/KevsOno/hotportion
    plan: starter
    region: frankfurt  # or oregon, ohio, singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PRIMARY
        value: groq
      - key: AI_FALLBACK
        value: gemini
      - key: DEBUG
        value: false
    healthCheckPath: /health
    numInstances: 1
